name: MakaMek MapEditor Library
permissions:
  contents: read
on:
  push:
    branches:
      - main
    paths:
      - 'src/MakaMek.MapEditor/**'
      - 'tests/MakaMek.MapEditor.Test/**'
      - '.github/workflows/mapeditor.yml'
  pull_request:
    paths:
      - 'src/MakaMek.MapEditor/**'
      - 'tests/MakaMek.MapEditor.Test/**'
      - '.github/workflows/mapeditor.yml'

  workflow_dispatch:
env:
  NuGetDirectory: ${{ github.workspace }}/nuget
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Run MapEditor tests
        run: dotnet test tests/MakaMek.MapEditor.Test/MakaMek.MapEditor.Test.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:ExcludeByAttribute=GeneratedCodeAttribute /p:Include=[Sanet.MakaMek.MapEditor]Sanet.MakaMek.MapEditor.ViewModels*

      - name: Upload MapEditor tests results
        uses: codecov/codecov-action@v5
        with:
          files: ./tests/MakaMek.MapEditor.Test/coverage.opencover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
  
  publish-nuget:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write # OIDC token exchange for NuGet Trusted Publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Create nuget packages
        run: |
          dotnet pack src/MakaMek.MapEditor/MakaMek.MapEditor.csproj --configuration Release --output ${{ env.NuGetDirectory }}

      # NuGet Trusted Publishing: exchange the GitHub OIDC token for a
      # short-lived API key instead of using a long-lived NUGET_APIKEY secret.
      # The nuget.org policy is bound to this workflow filename, so renaming
      # the file (or moving the push to another workflow) breaks publishing.
      # `vars.NUGET_USER` is the nuget.org account that owns the policy.
      # Deliberately last: the exchanged key is only valid for one hour, so it
      # is requested immediately before the push rather than up front.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish NuGet package
        shell: bash
        run: |
          if ! compgen -G "${{ env.NuGetDirectory }}/*.nupkg" > /dev/null; then
            echo "::error::No .nupkg found in ${{ env.NuGetDirectory }}"
            exit 1
          fi
          for file in "${{ env.NuGetDirectory }}"/*.nupkg; do
            dotnet nuget push "$file" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
