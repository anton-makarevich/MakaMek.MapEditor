name: Deploy Android to Stores

# Manual-only deployment pipeline.
#
# Only the repository owner is allowed to run it: workflow_dispatch can be
# triggered by anyone with write access, so the deploy job verifies the actor
# against github.repository_owner and fails otherwise. The
# play-store-production environment provides an extra approval gate.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (git tag v<version>)'
        required: true
        type: choice
        # Keep in sync with <Version> in Directory.Build.props. Add the new
        # version here on every release.
        options:
          - '0.7.8'
      store:
        description: 'Store to deploy to'
        required: true
        type: choice
        default: 'Google Play - internal track'
        options:
          - 'Google Play - internal track'
          # Add more stores here as they become available, e.g.
          # 'Google Play - beta track', 'Amazon Appstore'.

permissions:
  contents: read
  actions: read # Allow resolving the build run and downloading its artifacts

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: play-store-production
    env:
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check actor is repository owner
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "::error::Only the repository owner (${{ github.repository_owner }}) may run this deployment."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      # The build pipeline uploads artifacts as MakaMek-MapEditor-Android. Find
      # the successful build run for the tag of the selected version.
      - name: Resolve build run for version
        id: resolve_run
        run: |
          run_id="$(gh run list \
            --workflow=build-android.yml \
            --branch "v${{ inputs.version }}" \
            --event push \
            --status success \
            --json databaseId \
            --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful Android build found for tag v${{ inputs.version }}."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: MakaMek-MapEditor-Android
          run-id: ${{ steps.resolve_run.outputs.run_id }}
          path: ./android-artifact

      # Push the signed AAB to the internal track of Google Play
      - name: Upload AAB to Google Play (internal track)
        if: ${{ inputs.store == 'Google Play - internal track' && env.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: nl.sanetby.makamek.mapeditor
          releaseFiles: ./android-artifact/*-Signed.aab
          track: internal
          status: completed
          whatsNewDirectory: ./distribution/whatsnew
