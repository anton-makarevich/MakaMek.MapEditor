name: Build and Release Android APK

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # Run on version tags
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install Android workload
        run: dotnet workload install android

      # Production releases are signed with the keystore stored in
      # ANDROID_KEYSTORE_BASE64. When it is not configured (main pushes,
      # manual runs, forks) the build falls back to debug-keystore signing.
      - name: Decode Android release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.keystore"

      - name: Publish signed Android APK
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
        run: |
          sign_args=()
          if [ -f "$RUNNER_TEMP/android-release.keystore" ]; then
            sign_args=(
              "-p:AndroidSigningKeyStore=$RUNNER_TEMP/android-release.keystore"
              "-p:AndroidSigningKeyAlias=$ANDROID_KEYSTORE_ALIAS"
              "-p:AndroidSigningStorePass=$ANDROID_KEYSTORE_STORE_PASS"
              "-p:AndroidSigningKeyPass=$ANDROID_KEYSTORE_KEY_PASS"
            )
          fi
          dotnet publish src/MakaMek.MapEditor.Android/MakaMek.MapEditor.Android.csproj -c Release -p:AndroidPackageFormat=apk "${sign_args[@]}"

      # AAB for Google Play, built as a separate publish so both formats are produced
      - name: Publish signed Android AAB
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_STORE_PASS }}
          ANDROID_KEYSTORE_KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_KEY_PASS }}
        run: |
          sign_args=()
          if [ -f "$RUNNER_TEMP/android-release.keystore" ]; then
            sign_args=(
              "-p:AndroidSigningKeyStore=$RUNNER_TEMP/android-release.keystore"
              "-p:AndroidSigningKeyAlias=$ANDROID_KEYSTORE_ALIAS"
              "-p:AndroidSigningStorePass=$ANDROID_KEYSTORE_STORE_PASS"
              "-p:AndroidSigningKeyPass=$ANDROID_KEYSTORE_KEY_PASS"
            )
          fi
          dotnet publish src/MakaMek.MapEditor.Android/MakaMek.MapEditor.Android.csproj -c Release -p:AndroidPackageFormat=aab "${sign_args[@]}"

      # For tagged releases only
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src/MakaMek.MapEditor.Android/bin/Release/net10.0-android/*-Signed.apk
            src/MakaMek.MapEditor.Android/bin/Release/net10.0-android/*-Signed.aab
          draft: false
          prerelease: false
          generate_release_notes: false # Only one pipeline generates release notes

      # For all builds (including main branch pushes and manual runs)
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MakaMek-MapEditor-Android
          path: |
            src/MakaMek.MapEditor.Android/bin/Release/net10.0-android/*-Signed.apk
            src/MakaMek.MapEditor.Android/bin/Release/net10.0-android/*-Signed.aab
          retention-days: 90  # Keep artifacts for 90 days

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment: play-store-production
    runs-on: ubuntu-latest
    env:
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Android AAB
        uses: actions/download-artifact@v4
        with:
          name: MakaMek-MapEditor-Android
          path: ./android-artifact

      # Push the signed AAB to the internal track of Google Play
      - name: Upload AAB to Google Play (internal track)
        if: ${{ env.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: nl.sanetby.makamek.mapeditor
          releaseFiles: ./android-artifact/*-Signed.aab
          track: internal
          status: completed
          whatsNewDirectory: ./distribution/whatsnew
